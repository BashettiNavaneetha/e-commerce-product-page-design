<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Sneakers</div>
        <ul class="nav-links">
            <li>Collections</li>
            <li>Men</li>
            <li>Women</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
        <div class="cart-profile">
            <img src="images/cart-icon.png" alt="cart" class="cart-icon">
            <img src="images/girl.jpg" alt="profile" class="profile">
        </div>
    </nav>
    <main class="product-container">
        <div class="gallery">
            <img src="images/shoe.png" alt="sneakers" class="main-img">
            <div class="thumbnails">
                <img src="images/shoe.png" alt="" class="thumb active">
                <img src="images/shoe-1.png" alt="" class="thumb">
                <img src="images/shoe-2.png" alt="" class="thumb">
            </div>
        </div>
        <div class="details">
            <p class="company">Sneakers Company </p>
            <h1>Fall Limited Edition Sneakers</h1>
            <p class="description">
                These low-profile sneakersare your perfect casual wear companion. Featuring a durable outer sole, they'll withstand everything the weather can offer.
            </p>
            <div class="price-box">
                <div>
                    <span class="price">$125.00</span>
                    <span class="discount">50%</span>
                </div>
                <p class="old-price">$250.00</p>
            </div>

            <div class="actions">
                <div class="quantity">
                    <button>-</button>
                    <span>0</span>
                    <button>+</button>
                </div>
                <button class="add-cart">🛒 Add to cart</button>
            </div>
        </div>
    </main>
</body>
</html>
